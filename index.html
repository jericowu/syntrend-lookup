<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>三創專櫃快速查詢</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap"><div class="eyebrow">SYNTREND · CUSTOMER SERVICE TOOL</div><h1>三創專櫃快速查詢</h1><p>品牌、櫃位、副牌與樓層平面圖，一次查找。</p></div></header><main class="wrap"><section class="searchPanel"><label for="search">搜尋品牌、商品或櫃位</label><div class="searchRow"><input id="search" type="search" autocomplete="off" placeholder="例如：Garmin、寶可夢、R214、耳機"><button id="clear" aria-label="清除搜尋">清除</button></div><div class="tabs"><button class="active" data-mode="all">全部</button><button data-mode="tenant">專櫃</button><button data-mode="sub">副牌／商品</button><button data-mode="hot">熱門商品</button></div></section><div class="floorbar" id="floorbar"></div><div class="layout"><section><div class="sectionhead"><h2 id="resultsTitle">樓層專櫃</h2><span id="count"></span></div><div id="results" class="results"></div></section><aside><div class="mapHead"><h2 id="mapTitle">1F 平面圖</h2><button id="expand">放大查看 ↗</button></div><div class="mapFrame"><img id="map" src="maps/1f plan.png" alt="樓層平面圖" loading="lazy"></div><p class="note">平面圖依提供的原始圖檔呈現。點選搜尋結果中的「查看地圖」可切換樓層；放大後可縮放查看。</p></aside></div><footer>資料來源：提供的樓層平面圖及專櫃副牌表。櫃位、品牌與販售品項可能異動，請以現場資訊為準。<br>此為個人工作輔助工具，非三創官方網站。</footer></main><dialog id="viewer"><div class="viewerTop"><strong id="viewerTitle">平面圖</strong><div><button id="zoomOut">－</button><button id="zoomIn">＋</button><button id="closeViewer">關閉 ✕</button></div></div><div id="imageScroll"><img id="bigMap" alt="放大平面圖"></div></dialog><script src="data.js"></script><script src="app.js"></script></body></html>
